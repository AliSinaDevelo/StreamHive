    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: true

      - name: TLS credential validity and expiry
        run: make test-tls-credential-health

  prometheus-format:
    name: Prometheus exposition format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: true

      - name: Typed Prometheus health exposition
        run: make test-prometheus-format

  health-server:
    name: health HTTP resource envelope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
