      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: true

      - name: Inventory status metric accounting
        run: make test-inventory-status-metrics

  content-integrity:
