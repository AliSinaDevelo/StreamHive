      - name: Health HTTP resource and shutdown bounds
        run: make test-health-server

  cli-shutdown:
    name: CLI shutdown lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: true

      - name: CLI shutdown and cancellation bounds
        run: make test-cli-shutdown

  lifecycle-compaction:
    name: lifecycle compaction acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: true

      - name: Real TCP stale-peer snapshot repair
        run: make test-lifecycle-compaction

  lifecycle-membership:
    name: lifecycle membership failure recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: true

      - name: Real TCP membership failure recovery
        run: make test-lifecycle-membership

  sbom:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.22.x"
          cache: true

      - name: CycloneDX SBOM
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.7.0
          cyclonedx-gomod mod -json -output sbom.cdx.json .

      # v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
