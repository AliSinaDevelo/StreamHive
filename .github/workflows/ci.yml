    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: true

      - name: Storage integrity status contract
        run: make test-storage-integrity

  storage-verify:
    name: offline storage verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: true

      - name: Offline durable-store integrity preflight
        run: make test-storage-verify

  storage-durability:
    name: storage mutation durability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: true

      - name: FileStore mutation durability
        run: make test-storage-durability

  peer-admission:
    name: peer admission overload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: true

      - name: Real TCP peer admission cap
        run: make test-peer-admission

  peer-reconnect:
    name: static peer reconnect health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: true

      - name: Static peer reconnect health
        run: make test-peer-reconnect

  peer-drain:
    name: P2P drain lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: true

      - name: Real TCP bounded peer drain
        run: make test-peer-drain

  tls-auth:
    name: TLS application auth acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: true

      - name: Real TCP TLS and application auth
        run: make test-tls-auth

  library-mtls:
    name: library mTLS admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: true

      - name: Real TCP library mTLS admission
        run: make test-mtls

  tls-rotation:
    name: restart-only TLS rotation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: true

      - name: Real TCP restart-only TLS rotation
        run: make test-tls-rotation

  cli-mtls:
    name: CLI mTLS admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: true

      - name: Real TCP CLI mutual TLS
        run: make test-mtls-cli

  tls-credential-health:
